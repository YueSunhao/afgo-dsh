name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Python 3.8 is EOL and absent from the newest runner image (ubuntu-26.04),
    # so keep it on 22.04 while newer interpreters use latest.
    runs-on: ${{ matrix.python-version == '3.8' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install runtime dependencies
        run: npm ci --omit=dev --legacy-peer-deps --ignore-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m py_compile scripts/afg.py

      - name: Version and help
        run: |
          python scripts/afg.py --version
          python scripts/afg.py --help
          python scripts/afg.py tasks --help

      - name: Catalog and Workflow Session tests
        run: python -m unittest discover -s tests

      - name: Workbench client tests
        run: node --test tests/*.test.mjs

      - name: Bundle manifest
        run: |
          node --check lib/index.js
          node --check lib/workbench.js
          node --check lib/client.js
          node --check lib/visualization.js
          node --check viewer/engine.js
          python - <<'PY'
          import json, pathlib
          pkg = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          assert pkg["name"] == "afgo-dsh", pkg.get("name")
          assert pkg["main"] == "lib/index.js", pkg.get("main")
          assert pathlib.Path(pkg["exports"]["./client"]).is_file()
          patch = pkg["dsh"]["bundle"]["patch"]
          assert pathlib.Path(patch).is_file(), patch
          assert "lib" in pkg["files"] and "scripts" in pkg["files"], pkg["files"]
          assert len(pkg["keywords"]) >= 20, len(pkg["keywords"])
          text = pathlib.Path("cordis.patch.yml").read_text(encoding="utf-8")
          assert "afgo-dsh" in text, "cordis patch 未引用包名"
          assert "id: afgo" in text, "cordis patch 缺少插件行 id"
          print("bundle manifest ok:", pkg["name"], pkg["version"], len(pkg["keywords"]), "keywords")
          PY

      - name: Validate JSON assets
        run: |
          python - <<'PY'
          import json, pathlib
          spec = json.loads(pathlib.Path("reference/openapi.json").read_text(encoding="utf-8"))
          assert spec.get("openapi"), "openapi.json 缺少 openapi 字段"
          n = sum(
              1
              for item in spec["paths"].values()
              for m in item
              if m in ("get", "post", "put", "patch", "delete")
          )
          print(f"openapi paths={len(spec['paths'])} operations={n}")
          for p in pathlib.Path("examples").glob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print(f"ok {p}")
          PY

      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert m, "SKILL.md 缺少 YAML frontmatter"
          fm = m.group(1)
          for key in ("name:", "description:"):
              assert key in fm, f"frontmatter 缺少 {key}"
          assert 'name: afg' in fm, "技能名应为 afg"
          # 非标准字段不再使用：DSH 的 skills-manager 与 WorkBuddy 都不解析它们
          for banned in ("allowed-tools:", "compatibility:"):
              assert banned not in fm, f"frontmatter 不应再包含 {banned}"
          print("SKILL.md frontmatter ok")
          PY

      - name: Launchers
        run: |
          bash -n scripts/run.sh
          chmod +x scripts/run.sh
          bash scripts/run.sh --version
          AFG_PYTHON="$(command -v python3)" bash scripts/run.sh --help > /dev/null

      - name: No credentials committed
        run: |
          # 令牌形态：32 位十六进制，且不是示例占位符
          if grep -rInE '\b[0-9a-f]{32}\b' --include='*.md' --include='*.py' --include='*.json' . \
             | grep -viE 'sha256|hash|example|占位'; then
            echo "::error::疑似把真实 API 令牌提交进仓库"
            exit 1
          fi
          echo "no credentials found"
